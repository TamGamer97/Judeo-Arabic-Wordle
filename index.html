<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Judeo-Arabic Wordle</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #842429;
        }
        #game-board {
            display: grid;
            grid-template-rows: repeat(6, 1fr);
            gap: 5px;
            margin-bottom: 20px;
        }
        .word-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
        }
        .letter-box {
            width: 50px;
            height: 50px;
            border: 2px solid #d3d6da;
            font-size: 2rem;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            text-transform: uppercase;
            color: white;
        }
        #keyboard {
            display: grid;
            grid-template-rows: repeat(3, 1fr);
            gap: 5px;
        }
        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 5px;
        }
        .key {
            width: 40px;
            height: 50px;
            background-color: white;
            color: black;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .key:hover {
            background-color: #bbb;
        }
        #message {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            color: white;
        }
        .image-container {
            position: absolute;
            width: 30%;
            height: 100%;
            top: 0px;
            left: 0px;
            overflow: hidden;
            z-index: -1;
        }
        .scrolling-images {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            animation: scrollImages 10s linear infinite;
        }
        .scrolling-images img {
            width: 100%;
            display: block;
        }
        .aboutIcon:hover{
            opacity: 0.7;
            cursor: pointer;
        }
        .enterBtn:hover{
            opacity: 0.6;
            cursor: pointer;
        }
        h1 { font-family: TimesNewRoman, "Times New Roman", Times, Baskerville, Georgia, serif; font-size: 24px; font-style: normal; font-variant: normal; font-weight: 700; line-height: 26.4px; }
        h3 { font-family: TimesNewRoman, "Times New Roman", Times, Baskerville, Georgia, serif; font-size: 14px; font-style: normal; font-variant: normal; font-weight: 700; line-height: 15.4px; }
        p { font-family: TimesNewRoman, "Times New Roman", Times, Baskerville, Georgia, serif; font-size: 14px; font-style: normal; font-variant: normal; font-weight: 400; line-height: 20px; }
        blockquote { font-family: TimesNewRoman, "Times New Roman", Times, Baskerville, Georgia, serif; font-size: 21px; font-style: normal; font-variant: normal; font-weight: 400; line-height: 30px; }
        pre { font-family: TimesNewRoman, "Times New Roman", Times, Baskerville, Georgia, serif; font-size: 13px; font-style: normal; font-variant: normal; font-weight: 400; line-height: 18.5714px; }

        /* New styles for the popup */
        .popup {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
        }
        .popup-content {
            background-color: #842429;
            color: #ffffff;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 90%;
            height: 350px;
            max-width: 800px;
            position: relative;
        }
        .close {
            color: #aaa;
            float: left;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .close:hover,
        .close:focus {
            color: #ffffff;
            text-decoration: none;
            cursor: pointer;
        }
        #howToPlayBtn {
            margin-bottom: 20px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1 style="color: white;">JUDEO-ARABIC WORDLE</h1>
    <div id="game-board"></div>
    <div id="keyboard"></div>

    <img class="aboutIcon" onclick="location.href = '/about.html' " src="/aboutIcon.png" style="width: 30px; position: absolute; margin-left: 400px; margin-top: 10px;">
    <img class="aboutIcon" id="howToPlayBtn" src="/helpIcon.png" style="width: 30px; position: absolute; margin-left: 500px;">


    <div class="image-container">
        <div class="scrolling-images">
            <img src="/doc1.png" alt="Document 1">
            <img src="/doc2.png" alt="Document 2">
            <img src="/doc3.png" alt="Document 3">
            <img src="/doc4.png" alt="Document 4">
            <img src="/doc5.png" alt="Document 5">
            <img src="/doc6.png" alt="Document 6">
            <img src="/doc7.png" alt="Document 6">
            <img src="/doc8.png" alt="Document 6">
            <img src="/doc9.png" alt="Document 6">
            <img src="/doc10.png" alt="Document 6">
        </div>
    </div>

    <div style="display: flex; gap: 20px;">
        <div onclick="handleEnter()" class="enterBtn" style="width: 130px; height: 40px; display: flex; justify-content: center; align-items: center; background-color: aliceblue; margin-top: 20px; border-radius: 10px;">
            <h1 style="text-align: center; font-weight: bold;">Enter</h1>
        </div>
    
        <div onclick="handleBackspace()" class="enterBtn" style="width: 70px; height: 40px; display: flex; justify-content: center; align-items: center; margin-top: 20px; border-radius: 10px;">
            <img src="backspaceIcon.png" style="width: 70px;" />
        </div>
    </div>

    <img src="/rightimage2.jpg" style="position: absolute; right: 0px; top: 0px; width: 30%; height: 100%; z-index: -1;">

    <!-- How To Play Popup -->
    <div id="howToPlayPopup" class="popup">
        <div class="popup-content">
            <span class="close">&times;</span>
            <h1 style="left: 60px; margin-top: 0px; position: absolute;">How to Play</h1>


            <h1 style="left: 20px; margin-top: 50px; position: absolute;">Guess the wordle in 6 tries</h1>
            <h1 style="left: 20px; margin-top: 100px; position: absolute; font-size: 18px;">Each guess must be a valid 5 letter word</h1>
            <h1 style="left: 20px; margin-top: 130px; position: absolute; font-size: 18px;">The color of the tiles will change to show how close your guess was to the word</h1>


        </div>
    </div>

    <div id="resultPopup" class="popup">
        <div class="popup-content">
            <span class="close" onclick="document.getElementById('resultPopup').style.display = 'none'">&times;</span>
            <h1 style=" margin-top: 20px; text-align: center;">Word of the day</h1>


            <div id="message"></div>

        </div>
    </div>

    <script>
         const words = ['ברדעה', 'בקסאת', 'בלילג', 'עלאמה', 'אלאגה', 'ברניה', 'בראדה', 'ברכאן'];
        const englishTranslation = ['word 1', 'word 2', 'word 3', 'word 4', 'word 5']
        const lanugageOfOrigin = ['Arabic', 'Arabic','Arabic','Arabic','Arabic',]
        var wordIndex = Math.floor(Math.random() * words.length) // random index

        wordIndex = new Date().getDate() // date index

        function getWordOfTheDay() {
            const startDate = new Date('2023-08-02'); // Start date for the word list cycle
            const today = new Date();
            const diffDays = Math.floor((today - startDate) / (1000 * 60 * 60 * 24));
            const wordIndexCalc = diffDays % words.length;
            return wordIndexCalc
        }

        wordIndex = getWordOfTheDay()

        const targetWord = words[wordIndex];
        let currentAttempt = 0;
        let currentGuess = '';

        const gameBoard = document.getElementById('game-board');
        const keyboard = document.getElementById('keyboard');
        const messageElement = document.getElementById('message');

        const hebrewLayout = [
            'קראטוןםפ',
            'שדגכעיחלך',
            'זסבהנמצתץ'
        ];

        function createGameBoard() {
            for (let i = 0; i < 6; i++) {
                const row = document.createElement('div');
                row.className = 'word-row';
                for (let j = 0; j < 5; j++) {
                    const box = document.createElement('div');
                    box.className = 'letter-box';
                    row.appendChild(box);
                }
                gameBoard.appendChild(row);
            }
        }

        function createKeyboard() {
            hebrewLayout.forEach((row, i) => {
                const keyboardRow = document.createElement('div');
                keyboardRow.className = 'keyboard-row';
                row.split('').forEach(letter => {
                    const key = document.createElement('button');
                    key.className = 'key';
                    key.textContent = letter;
                    key.addEventListener('click', () => handleKeyPress(letter));
                    keyboardRow.appendChild(key);
                });
                keyboard.appendChild(keyboardRow);
            });
        }

        function handleKeyPress(letter) {
            if (currentGuess.length < 5) {
                currentGuess += letter;
                updateGameBoard();
            }
        }

        function handleBackspace() {
            if (currentGuess.length > 0) {
                currentGuess = currentGuess.slice(0, -1);
                updateGameBoard();
            }
        }

        function handleEnter() {
            if (currentGuess.length === 5) {
                checkGuess();
                currentAttempt++;
                currentGuess = '';
                updateGameBoard();
            }
        }

        function updateGameBoard() {
            const row = gameBoard.children[currentAttempt];
            for (let i = 0; i < 5; i++) {
                const box = row.children[i];
                box.textContent = currentGuess[i] || '';
            }
        }

        function checkGuess() {
            const row = gameBoard.children[currentAttempt];
            let correctLetters = 0;

            for (let i = 0; i < 5; i++) {
                const box = row.children[i];
                const letter = currentGuess[i];

                if (letter === targetWord[i]) {
                    box.style.backgroundColor = '#6aaa64';
                    box.style.color = '#ffffff';
                    correctLetters++;
                } else if (targetWord.includes(letter)) {
                    box.style.backgroundColor = '#c9b458';
                    box.style.color = '#ffffff';
                } else {
                    box.style.backgroundColor = '#787c7e';
                    box.style.color = '#ffffff';
                }
            }

            if (correctLetters === 5) {
                document.getElementById('resultPopup').style.display = 'block'
                // messageElement.innerHTML = '<h1>' + 'מזל טוב' + '<br>' + words[wordIndex] + ' :Judeo-Arabic Word' + '</h1>' + 'English Definition: ' + englishTranslation[wordIndex] + '<br>' + 'Lang uage of Origin: ' +  lanugageOfOrigin[wordIndex] + '<br><br>' + '!Try again tomorrow for a new word and definition'
                messageElement.innerHTML = '<h1>' + words[wordIndex] + ' :Judeo-Arabic Word' + '</h1>' + 'English Definition: ' + englishTranslation[wordIndex] + '<br>' + 'Lang uage of Origin: ' +  lanugageOfOrigin[wordIndex] + '<br><br>' + '!Try again tomorrow for a new word and definition'

            } else if (currentAttempt === 5) {
                document.getElementById('resultPopup').style.display = 'block'
                // messageElement.innerHTML = '<h1>' + 'לא נכון, התשובה הנכונה היא ' +  words[wordIndex] +  '<br>' + words[wordIndex] + ' :Judeo-Arabic Word' + '</h1>' + 'English Definition: ' + englishTranslation[wordIndex] + '<br>' + 'Lang uage of Origin: ' +  lanugageOfOrigin[wordIndex] + '<br><br>' + '!Try again tomorrow for a new word and definition' + '</h1>' 
                messageElement.innerHTML = '<h1>' + words[wordIndex] + ' :Judeo-Arabic Word' + '</h1>' + 'English Definition: ' + englishTranslation[wordIndex] + '<br>' + 'Lang uage of Origin: ' +  lanugageOfOrigin[wordIndex] + '<br><br>' + '!Try again tomorrow for a new word and definition' + '</h1>' 

            }
        }

        function isHebrewLetter(key) {
            return hebrewLayout.some(row => row.includes(key));
        }

        createGameBoard();
        createKeyboard();

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace') {
                handleBackspace();
            } else if (e.key === 'Enter') {
                handleEnter();
            } else if (isHebrewLetter(e.key)) {
                handleKeyPress(e.key);
            }
        });

        function setupScrollingImages() {
            const container = document.querySelector('.image-container');
            const scrollingImages = document.querySelector('.scrolling-images');
            const imgHeight = scrollingImages.querySelector('img').offsetHeight;

            function checkScroll() {
                if (scrollingImages.offsetTop <= -3000) {
                    scrollingImages.style.top = '50px';
                } else {
                    scrollingImages.style.top = `${scrollingImages.offsetTop - 1}px`;
                }
                requestAnimationFrame(checkScroll);
            }

            checkScroll();
        }

        window.addEventListener('load', setupScrollingImages);

        // How To Play Popup JavaScript
        const howToPlayBtn = document.getElementById("howToPlayBtn");
        const howToPlayPopup = document.getElementById("howToPlayPopup");
        const closeBtn = document.getElementsByClassName("close")[0];

        howToPlayBtn.onclick = function() {
            howToPlayPopup.style.display = "block";
        }

        closeBtn.onclick = function() {
            howToPlayPopup.style.display = "none";
        }

        window.onclick = function(event) {
            if (event.target == howToPlayPopup) {
                howToPlayPopup.style.display = "none";
            }
        }
    </script>
</body>
</html>
