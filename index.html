<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Judeo-Arabic Wordle</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #842429;
        }
        #game-board {
            display: grid;
            grid-template-rows: repeat(6, 1fr);
            gap: 5px;
            margin-bottom: 20px;
        }
        .word-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
        }
        .letter-box {
            width: 50px;
            height: 50px;
            border: 2px solid #d3d6da;
            font-size: 2rem;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            text-transform: uppercase;
            color: white;
        }
        #keyboard {
            display: grid;
            grid-template-rows: repeat(3, 1fr);
            gap: 5px;
        }
        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 5px;
        }
        .key {
            width: 40px;
            height: 50px;
            /* background-color: #d3d6da; */
            background-color: white;
            color: black;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .key:hover {
            background-color: #bbb;
        }
        #message {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .image-container {
        position: absolute;
        width: 30%;
        height: 100%;
        top: 0px;
        left: 0px;
        overflow: hidden;
            z-index: -1;
    }

    .scrolling-images {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        animation: scrollImages 10s linear infinite;
    }

    .scrolling-images img {
        width: 100%;
        display: block;
    }
    .aboutIcon:hover{
        opacity: 0.7;
        cursor: pointer;
    }

    /* @keyframes scrollImages {
        0% { transform: translateY(0); }
        100% { transform: translateY(-33.33%); }
    } */
    h1 { font-family: TimesNewRoman, "Times New Roman", Times, Baskerville, Georgia, serif; font-size: 24px; font-style: normal; font-variant: normal; font-weight: 700; line-height: 26.4px; } h3 { font-family: TimesNewRoman, "Times New Roman", Times, Baskerville, Georgia, serif; font-size: 14px; font-style: normal; font-variant: normal; font-weight: 700; line-height: 15.4px; } p { font-family: TimesNewRoman, "Times New Roman", Times, Baskerville, Georgia, serif; font-size: 14px; font-style: normal; font-variant: normal; font-weight: 400; line-height: 20px; } blockquote { font-family: TimesNewRoman, "Times New Roman", Times, Baskerville, Georgia, serif; font-size: 21px; font-style: normal; font-variant: normal; font-weight: 400; line-height: 30px; } pre { font-family: TimesNewRoman, "Times New Roman", Times, Baskerville, Georgia, serif; font-size: 13px; font-style: normal; font-variant: normal; font-weight: 400; line-height: 18.5714px; }
    </style>
</head>
<body>
    <h1 style="color: white;">JUDEO-ARABIC WORDLE</h1>
    <div id="message"></div>
    <div id="game-board"></div>
    <div id="keyboard"></div>

    <img class="aboutIcon" onclick="location.href = '/about.html' " src="/aboutIcon.png" style="width: 30px; position: absolute; margin-left: 400px; margin-top: 10px;">


    <div class="image-container">
        <div class="scrolling-images">
            <img src="/doc1.png" alt="Document 1">
            <img src="/doc2.png" alt="Document 2">
            <img src="/doc3.png" alt="Document 3">
            <img src="/doc4.png" alt="Document 4">
            <img src="/doc5.png" alt="Document 5">
            <img src="/doc6.png" alt="Document 6">
            <img src="/doc7.png" alt="Document 6">
            <img src="/doc8.png" alt="Document 6">
            <img src="/doc9.png" alt="Document 6">
            <img src="/doc10.png" alt="Document 6">
            <!-- <img src="/doc4.png" alt="Document 4"> -->
        </div>
    </div>


    <img src="/rightImage.jpeg" style="position: absolute; right: 0px; top: 0px; width: 30%; height: 100%;">

    <script>
        const words = ['שלום', 'תודה', 'עברי', 'ישראל', 'מילה'];
        const englishTranslation = ['word 1', 'word 2', 'word 3', 'word 4', 'word 5']
        var wordIndex = Math.floor(Math.random() * words.length) // random index

        wordIndex = new Date().getDate() // date index

        function getWordOfTheDay() {
            const startDate = new Date('2023-08-02'); // Start date for the word list cycle
            const today = new Date();
            const diffDays = Math.floor((today - startDate) / (1000 * 60 * 60 * 24));
            const wordIndexCalc = diffDays % words.length;
            return wordIndexCalc
        }

        wordIndex = getWordOfTheDay()



        const targetWord = words[wordIndex];
        let currentAttempt = 0;
        let currentGuess = '';

        const gameBoard = document.getElementById('game-board');
        const keyboard = document.getElementById('keyboard');
        const messageElement = document.getElementById('message');

        const hebrewLayout = [
            'קראטוןםפ',
            'שדגכעיחלך',
            'זסבהנמצתץ'
        ];

        function createGameBoard() {
            for (let i = 0; i < 6; i++) {
                const row = document.createElement('div');
                row.className = 'word-row';
                for (let j = 0; j < 5; j++) {
                    const box = document.createElement('div');
                    box.className = 'letter-box';
                    row.appendChild(box);
                }
                gameBoard.appendChild(row);
            }
        }

        function createKeyboard() {
            hebrewLayout.forEach((row, i) => {
                const keyboardRow = document.createElement('div');
                keyboardRow.className = 'keyboard-row';
                row.split('').forEach(letter => {
                    const key = document.createElement('button');
                    key.className = 'key';
                    key.textContent = letter;
                    key.addEventListener('click', () => handleKeyPress(letter));
                    keyboardRow.appendChild(key);
                });
                keyboard.appendChild(keyboardRow);
            });
        }

        function handleKeyPress(letter) {
            if (currentGuess.length < 5) {
                currentGuess += letter;
                updateGameBoard();
            }
        }

        function handleBackspace() {
            if (currentGuess.length > 0) {
                currentGuess = currentGuess.slice(0, -1);
                updateGameBoard();
            }
        }

        function handleEnter() {
            if (currentGuess.length === 5) {
                checkGuess();
                currentAttempt++;
                currentGuess = '';
                updateGameBoard();
            }
        }

        function updateGameBoard() {
            const row = gameBoard.children[currentAttempt];
            for (let i = 0; i < 5; i++) {
                const box = row.children[i];
                box.textContent = currentGuess[i] || '';
            }
        }

        function checkGuess() {
            const row = gameBoard.children[currentAttempt];
            let correctLetters = 0;

            for (let i = 0; i < 5; i++) {
                const box = row.children[i];
                const letter = currentGuess[i];

                if (letter === targetWord[i]) {
                    box.style.backgroundColor = '#6aaa64';
                    box.style.color = '#ffffff';
                    correctLetters++;
                } else if (targetWord.includes(letter)) {
                    box.style.backgroundColor = '#c9b458';
                    box.style.color = '#ffffff';
                } else {
                    box.style.backgroundColor = '#787c7e';
                    box.style.color = '#ffffff';
                }
            }

            if (correctLetters === 5) {
                messageElement.textContent = 'כל הכבוד! ניצחת! ' + englishTranslation[wordIndex];
            } else if (currentAttempt === 5) {
                messageElement.textContent = `המשחק נגמר. המילה הייתה ${targetWord}` + englishTranslation[wordIndex];
            }
        }

        function isHebrewLetter(key) {
            return hebrewLayout.some(row => row.includes(key));
        }

        createGameBoard();
        createKeyboard();

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace') {
                handleBackspace();
            } else if (e.key === 'Enter') {
                handleEnter();
            } else if (isHebrewLetter(e.key)) {
                handleKeyPress(e.key);
            }
        });


        // Add this at the end of the script
    function setupScrollingImages() {
        const container = document.querySelector('.image-container');
        const scrollingImages = document.querySelector('.scrolling-images');
        const imgHeight = scrollingImages.querySelector('img').offsetHeight;

        function checkScroll() {
            if (scrollingImages.offsetTop <= -3000) {
                scrollingImages.style.top = '50px';
            } else {
                scrollingImages.style.top = `${scrollingImages.offsetTop - 1}px`;
            }
            requestAnimationFrame(checkScroll);
        }

        checkScroll();
    }

    window.addEventListener('load', setupScrollingImages);
    </script>
</body>
</html>
